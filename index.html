<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Wordsy</title>
  <meta name="description" content="Three curious words a day, with flip-card recall.">
  <meta name="theme-color" content="#f5eedf" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#151826" media="(prefers-color-scheme: dark)">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Wordsy">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="stylesheet" href="fonts/fonts.css">
  <link rel="stylesheet" href="css/styles.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <div class="app">
    <header class="top">
      <span id="dateline"></span>
      <span class="dots" id="dots" role="img"></span>
    </header>
    <div id="banners" class="banners"></div>
    <main id="view-today" class="view"></main>
    <main id="view-archive" class="view" hidden>
      <input id="search" class="search" type="search" placeholder="Search words…" aria-label="Search words" autocomplete="off">
      <div id="archive-body" class="arch"></div>
    </main>
    <nav class="tabs" aria-label="Views">
      <button type="button" id="tab-today" data-action="view" data-view="today">Today</button>
      <button type="button" id="tab-archive" data-action="view" data-view="archive">Archive</button>
    </nav>
  </div>
  <div id="overlay" class="overlay" hidden>
    <div class="sheet" role="dialog" aria-modal="true" aria-label="Word">
      <div id="sheet-body" class="sheet-body"></div>
      <div class="actions"><button type="button" class="primary" data-action="close-word">Close</button></div>
    </div>
  </div>
</body>
</html>
